<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a2342" />
    <meta name="robots" content="index, follow" />
    <meta
      name="description"
      content="Portugal Must Honor Its Commitments — an advocacy campaign for Golden Visa investors and residency applicants affected by administrative delays and retrospective policy changes. Sign the petition, register your case, join the legal action."
    />
    <meta name="author" content="Portugal Must Honor Its Commitments" />
    <meta
      name="keywords"
      content="Portugal Golden Visa, residency delays, AIMA backlog, residence card, citizenship, legal certainty, petition, legal action, investor residency"
    />

    <!-- Canonical host is the apex; the React app refines canonical/OG per route. -->
    <link rel="canonical" href="https://honoryourcommitment.com/" />

    <!-- Icons & PWA manifest -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#0a2342" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Portugal Must Honor Its Commitments" />
    <meta property="og:title" content="Portugal Must Honor Its Commitments" />
    <meta
      property="og:description"
      content="Thousands of investors and residency applicants followed Portugal's rules. Many have waited more than five years. Demand action."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://honoryourcommitment.com/" />
    <meta property="og:image" content="https://honoryourcommitment.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Portugal Must Honor Its Commitments — a campaign for legal certainty"
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="pt_PT" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta property="og:locale:alternate" content="es_ES" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Portugal Must Honor Its Commitments" />
    <meta
      name="twitter:description"
      content="Thousands followed Portugal's rules and invested. Many have waited more than five years for residency. Demand action."
    />
    <meta name="twitter:image" content="https://honoryourcommitment.com/og-image.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://honoryourcommitment.com/#organization",
            "name": "Portugal Must Honor Its Commitments",
            "url": "https://honoryourcommitment.com/",
            "logo": "https://honoryourcommitment.com/favicon.svg",
            "description": "An advocacy campaign for Golden Visa investors, residency applicants, and their families affected by administrative delays and retrospective changes to Portugal's citizenship and residency framework."
          },
          {
            "@type": "WebSite",
            "@id": "https://honoryourcommitment.com/#website",
            "url": "https://honoryourcommitment.com/",
            "name": "Portugal Must Honor Its Commitments",
            "publisher": { "@id": "https://honoryourcommitment.com/#organization" },
            "inLanguage": ["en", "pt", "zh", "es"]
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <title>Portugal Must Honor Its Commitments</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
